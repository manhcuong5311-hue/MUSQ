<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>neutral environment export</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js" } }
</script>
</head>
<body style="background:#222;color:#eee;font:13px monospace">
<pre id="log"></pre>
<script type="module">
// model-viewer's "neutral" studio (its own EnvironmentScene), captured at the
// origin into a cube map the way model-viewer does (linear, half float, no
// tone mapping), unwrapped to a 2:1 lat-long and saved as Radiance .hdr for
// RealityKit's image-based lighting.
import * as THREE from 'three';
import EnvironmentScene from 'https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/lib/three-components/EnvironmentScene.js';
const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
const W = 2048, H = 1024;
const renderer = new THREE.WebGLRenderer();
renderer.toneMapping = THREE.NoToneMapping;
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new EnvironmentScene('neutral');
const cubeRT = new THREE.WebGLCubeRenderTarget(1024, { type: THREE.FloatType, colorSpace: THREE.LinearSRGBColorSpace });
const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
cubeCam.update(renderer, scene);
// Lat-long: u 0..1 is longitude -180..180 measured from -Z towards +X (so the
// image centre faces -Z); v 0 is the bottom (-Y), v 1 the top (+Y).
const mat = new THREE.ShaderMaterial({
  uniforms: { cube: { value: cubeRT.texture } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform samplerCube cube; varying vec2 vUv;
    void main(){
      float lon = (vUv.x - 0.5) * 6.28318530718;
      float lat = (vUv.y - 0.5) * 3.14159265359;
      vec3 dir = vec3(cos(lat) * sin(lon), sin(lat), -cos(lat) * cos(lon));
      gl_FragColor = vec4(textureCube(cube, dir).rgb, 1.0);
    }`,
});
const q = new THREE.Scene();
q.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType });
renderer.setRenderTarget(rt);
renderer.render(q, new THREE.Camera());
const px = new Float32Array(W * H * 4);
renderer.readRenderTargetPixels(rt, 0, 0, W, H, px);
let max = 0, sum = 0;
for (let i = 0; i < px.length; i += 4) { max = Math.max(max, px[i], px[i + 1], px[i + 2]); sum += (px[i] + px[i + 1] + px[i + 2]) / 3; }
log(`radiance max ${max.toFixed(2)} mean ${(sum / (W * H)).toFixed(3)}`);
// Radiance RGBE, flat scanlines, top row first.
const header = `#?RADIANCE\nFORMAT=32-bit_rle_rgbe\n\n-Y ${H} +X ${W}\n`;
const out = new Uint8Array(header.length + W * H * 4);
for (let i = 0; i < header.length; i++) out[i] = header.charCodeAt(i);
let o = header.length;
for (let y = H - 1; y >= 0; y--) {
  for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    const r = px[i], g = px[i + 1], b = px[i + 2];
    const m = Math.max(r, g, b);
    if (m < 1e-32) { out[o++] = 0; out[o++] = 0; out[o++] = 0; out[o++] = 0; continue; }
    const e = Math.ceil(Math.log2(m) + 1e-9);
    const f = 256 / Math.pow(2, e);
    out[o++] = Math.min(255, Math.floor(r * f)); out[o++] = Math.min(255, Math.floor(g * f));
    out[o++] = Math.min(255, Math.floor(b * f)); out[o++] = e + 128;
  }
}
await fetch('/__save?name=neutral-env.hdr', { method: 'POST', body: new Blob([out]) });
log('saved neutral-env.hdr ' + out.length + ' bytes');
</script>
</body>
</html>
